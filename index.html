<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Meadowbrook Acres</title>
<style>body{margin:0;background:#1b140d;color:#eee;font-family:monospace;overflow:hidden}canvas{display:block;position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
html,body{height:100%;overscroll-behavior:none}
body.touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
#tc{display:none}body.touch #tc{display:block}body.touch.hidectl #tc{display:none}
#ctlBtn{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom));background:rgba(40,25,15,.85);border:2px solid #e0b070;color:#ffe9b0;border-radius:8px;font:bold 13px monospace;padding:5px 10px}
#ver{position:fixed;z-index:20;left:calc(4px + env(safe-area-inset-left));bottom:calc(4px + env(safe-area-inset-bottom));color:#ffe9b0;font:11px monospace;opacity:.8;pointer-events:none}
.tb{position:fixed;z-index:5;background:rgba(74,46,24,.75);border:2px solid #e0b070;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);color:#ffe9b0;border-radius:10px;font:bold 15px monospace;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(224,176,112,.9);color:#222}
#dpad{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:150px;height:150px;z-index:5;touch-action:none}
#dpad .tb{position:absolute;width:50px;height:50px}
#act{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:5}
#act .tb{position:static;width:52px;height:46px;margin:4px}
#bUse{width:76px!important;height:76px!important;border-radius:50%!important;font-size:18px!important}
.row{display:flex;justify-content:flex-end}
#top{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;z-index:5}
#top .tb{position:static;padding:6px 10px;margin-left:6px;border-radius:8px}
#shopUI{display:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6}
#shopUI.show{display:flex}#shopUI .tb{position:static;padding:10px 12px;margin:3px}
@media (orientation:portrait){
body.touch{background:#2a1c10}
#act{width:140px}#act .row{flex-wrap:wrap}#act .tb{width:58px;height:50px}
#bUse{width:120px!important;height:90px!important;border-radius:45px!important;font-size:22px!important}
#dpad{width:168px;height:168px}
#dpad,#act{bottom:calc(28px + env(safe-area-inset-bottom))}
#shopUI{bottom:auto;top:calc(var(--ch,260px) + 8px);flex-wrap:wrap;justify-content:center;width:96vw}
#top{top:calc(var(--ch,260px) + 8px);left:50%;right:auto;transform:translateX(-50%)}
body.shop #top{display:none}}
</style></head>
<body><canvas id="c" width="960" height="640"></canvas>
<div id="ver">v3</div><button id="ctlBtn" type="button">Controls</button>
<div id="tc"><div id="dpad"><div class="tb" data-d="arrowup" style="left:33.3%;top:0">&#9650;</div><div class="tb" data-d="arrowleft" style="left:0;top:33.3%">&#9664;</div><div class="tb" data-d="arrowright" style="left:66.6%;top:33.3%">&#9654;</div><div class="tb" data-d="arrowdown" style="left:33.3%;top:66.6%">&#9660;</div></div>
<div id="act"><div class="row"><div class="tb" data-k="1">Hoe</div><div class="tb" data-k="2">Wtr</div><div class="tb" data-k="3">Seed</div><div class="tb" data-k="4">Hand</div></div>
<div class="row"><div class="tb" data-k="q">Q&#8635;</div><div class="tb" id="bUse" data-k=" ">USE</div></div></div>
<div id="top"><div class="tb" data-k="h">Help</div><div class="tb" data-k="p">Save</div><div class="tb" data-k="l">Load</div></div>
<div id="shopUI"><div class="tb" data-k="1">Buy 1</div><div class="tb" data-k="2">Buy 2</div><div class="tb" data-k="3">Buy 3</div><div class="tb" data-k="s">Sell all</div><div class="tb" data-k="escape">Leave</div></div></div>
<script>
"use strict";
// ================= WEATHER / EVENT SYSTEM (data-driven) =================
// Each day, events are checked in order; the first whose trigger passes becomes today's weather.
// trigger(day, rng) -> bool. particle: null or {color, shape:'drop'|'square'|'flake', count, speed}.
// hooks: onDayStart(game), onTick(game, dt), onTileHit(game) — all optional.
const EVENTS = [
  { id:'chocolate', name:'Chocolate Rain', tint:'rgba(90,50,20,0.18)',
    trigger:(day,r)=> day>2 && r<0.08,
    particle:{color:'#6b3a1a', shape:'drop', count:140, speed:9},
    onDayStart:g=>{ waterAll(g); for(let i=0;i<6;i++) spawnPickup(g,'chocolate'); g.msg('Chocolate rain! Collect the treats.'); },
    onTick:(g,dt)=>{ if(Math.random()<dt*0.02) spawnPickup(g,'chocolate'); } },
  { id:'rain', name:'Rain', tint:'rgba(30,40,80,0.22)',
    trigger:(day,r)=> r<0.3,
    particle:{color:'#9cc4ff', shape:'drop', count:160, speed:10},
    onDayStart:g=>{ waterAll(g); g.msg('Rain today - crops are watered.'); } },
  { id:'sunny', name:'Sunny', tint:null, trigger:()=>true, particle:null }
];
// ================= ASSET OVERRIDES =================
// Every sprite is generated procedurally into SPR[key]. To replace one with your own art,
// map its key to an image URL here (same pixel size as the procedural sprite), e.g.
//   ASSETS.tree_0 = 'art/oak.png';  ASSETS.farmer_down_1 = 'art/me_walk1.png';
// Call listSpriteKeys() in the console to see all keys and sizes. Missing/failed images fall back silently.
const ASSETS = {};
// ================= DATA =================
const CROPS = {
  radish:{name:'Radish', seedPrice:20, sell:45, days:3, color:'#e33a5a'},
  corn:  {name:'Corn',   seedPrice:40, sell:100,days:5, color:'#f2d23a'},
  melon: {name:'Melon',  seedPrice:80, sell:260,days:7, color:'#3fae4a'}
};
const ITEMS = {chocolate:{name:'Chocolate', sell:60, color:'#5a2e12'}};
const SAVE_V=3, TS=16, W=60, H=45, OX=10, OY=8, cv=document.getElementById('c'), ctx=cv.getContext('2d');
// tiles: 0 grass,1 path,2 water,3 wall,4 floor,5 bed,6 counter,7 tree,8 farmland(tillable grass),9 door,10 fence,11 bush,12 rock
let map=[];
const BUILDINGS=[{id:'house',x:13,y:10,w:8,h:6,roof:['#7a2f22','#a4432e','#c65b3c','#e07a52'],wall:['#6b4128','#8c5a36','#a8714a'],alpha:1},
                 {id:'shop', x:36,y:10,w:9,h:6,roof:['#24505e','#30697a','#3f8396','#5ba1b0'],wall:['#6e5a3c','#93794f','#b39766'],alpha:1}];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0;}
function buildMap(){const R=rng(1337);
  map=[];for(let y=0;y<H;y++){map.push([]);for(let x=0;x<W;x++){let t=0;
    if(x<2||y<2||x>=W-2||y>=H-2)t=7;
    if(x>=13&&x<=26&&y>=18&&y<=30)t=8;
    if(y==16&&x>=2&&x<W-2)t=1; if(x==32&&y>=2&&y<H-2)t=1;
    const ex=(x-46)/5.5,ey=(y-29)/3.6; if(ex*ex+ey*ey<1)t=2;
    map[y].push(t);}}
  rect(13,10,8,6,3,4); map[14][16]=9; map[11][14]=5; map[11][15]=5;   // house + bed
  rect(36,10,9,6,3,4); map[14][40]=9; for(let x=38;x<=42;x++)map[12][x]=6; // shop + counter
  for(let x=34;x<48;x+=3){map[20][x]=7;} map[15][16]=1; map[15][40]=1;
  for(let x=12;x<=27;x++){if(x!=19&&x!=20)map[17][x]=10; map[31][x]=10;} for(let y=17;y<=31;y++){map[y][12]=10;map[y][27]=10;}
  map[17][19]=1;map[17][20]=1;
  // inner forest edge + scattered scenery (deterministic)
  const free=(x,y,r)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const t=(map[y+j]||[])[x+i];if(t!==0&&t!==7)return false;}return true;};
  for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const d=Math.min(x-2,y-2,W-3-x,H-3-y);
    if(map[y][x]==0&&d<2&&R()<0.55-d*0.2&&free(x,y,1))map[y][x]=7;}
  for(let n=0;n<900;n++){const x=3+Math.floor(R()*(W-6)),y=3+Math.floor(R()*(H-6)),r=R();
    if(map[y][x]!=0||Math.abs(x-16)+Math.abs(y-15)<4||Math.abs(x-40)+Math.abs(y-15)<4)continue;
    if(r<0.45){if(free(x,y,1)&&(x>48||y>33||x<11||(y>20&&x>28)||(y<9&&R()<.5)))map[y][x]=7;}
    else if(r<0.6){if(free(x,y,1))map[y][x]=11;}
    else if(r<0.68){if(free(x,y,1))map[y][x]=12;}}
}
function rect(x0,y0,w,h,wall,floor){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)
  map[y][x]=(x==x0||y==y0||x==x0+w-1||y==y0+h-1)?wall:floor;}
const SOLID=new Set([2,3,6,7,5,10,11,12]);
const tileAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?7:map[y][x];
// ================= STATE =================
let G;
function newGame(){ buildMap(); G={v:SAVE_V,day:1,time:6*60,gold:150,energy:100,maxE:100,
  p:{x:16*TS+8,y:16*TS+10,dir:'down'}, tool:0, soil:{}, pickups:[],
  inv:{radish_seed:5,corn_seed:0,melon_seed:0,radish:0,corn:0,melon:0,chocolate:0}, seedSel:'radish',
  weather:'sunny'}; startDay(); }
const game={msg(t){msgT=t;msgTime=3;}};
let msgT='',msgTime=0,shopOpen=false,particles=[],walkDist=0,moving=false;
function ev(){return EVENTS.find(e=>e.id==G.weather)||EVENTS[EVENTS.length-1];}
function waterAll(){for(const k in G.soil)G.soil[k].wet=true;}
function spawnPickup(g,item){for(let n=0;n<30;n++){const x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));
  if([0,1,8].includes(map[y][x])&&!G.soil[x+','+y]){G.pickups.push({x,y,item});return;}}}
function startDay(){ G.pickups=G.pickups.filter(p=>false); const r=Math.random();
  const e=EVENTS.find(e=>e.trigger(G.day,r)); G.weather=e.id; e.onDayStart&&e.onDayStart(game); initParticles(); }
function initParticles(){particles=[];const p=ev().particle;if(p)for(let i=0;i<p.count;i++)particles.push({x:cam.x+Math.random()*view.w,y:cam.y+Math.random()*view.h,s:0.7+Math.random()*0.6});}
function sleep(){ // grow crops
  for(const k in G.soil){const s=G.soil[k];if(s.crop&&s.wet&&s.growth<CROPS[s.crop].days)s.growth++;s.wet=false;}
  const pass=G.time>=26*60; G.day++; G.time=6*60; G.energy=pass?Math.floor(G.maxE*0.6):G.maxE;
  startDay(); save(true); game.msg('Day '+G.day+' - '+ev().name+(pass?' (you passed out)':''));}
function save(q){localStorage.setItem('meadowbrook_save',JSON.stringify(G));if(!q)game.msg('Game saved.');}
// Old (v1/v2) saves used 32px tiles on a 40x26 map; shift them onto the 60x45 v3 map.
function migrate(s){
  const d={day:1,time:6*60,gold:150,energy:100,maxE:100,tool:0,soil:{},pickups:[],seedSel:'radish',weather:'sunny'};
  for(const k in d)if(s[k]===undefined||s[k]===null)s[k]=d[k];
  s.inv=Object.assign({radish_seed:0,corn_seed:0,melon_seed:0,radish:0,corn:0,melon:0,chocolate:0},s.inv||{});
  if(!CROPS[s.seedSel])s.seedSel='radish';
  if(!s.v||s.v<3){const soil={};for(const k in s.soil){const [x,y]=k.split(',').map(Number);soil[(x+OX)+','+(y+OY)]=s.soil[k];}s.soil=soil;
    s.pickups=(s.pickups||[]).map(p=>({x:p.x+OX,y:p.y+OY,item:p.item}));
    if(s.p)s.p={x:s.p.x/2+OX*TS,y:s.p.y/2+OY*TS+2,dir:s.p.dir||'down'};}
  if(!s.p||!isFinite(s.p.x)||!isFinite(s.p.y))s.p={x:16*TS+8,y:16*TS+10,dir:'down'};
  for(const k in s.soil){const [x,y]=k.split(',').map(Number);if(tileAt(x,y)!=8)delete s.soil[k];}
  s.pickups=s.pickups.filter(p=>ITEMS[p.item]&&[0,1,8].includes(tileAt(p.x,p.y)));
  if(!EVENTS.some(e=>e.id==s.weather))s.weather='sunny';
  s.v=SAVE_V;return s;}
function load(){const s=localStorage.getItem('meadowbrook_save');if(!s){game.msg('No save found.');return false;}
  let d;try{d=JSON.parse(s);}catch(_){game.msg('Save was unreadable.');return false;}
  buildMap();G=migrate(d);if(blocked(G.p.x,G.p.y)){G.p.x=16*TS+8;G.p.y=16*TS+10;}snapCam();initParticles();game.msg('Game loaded.');return true;}
// ================= INPUT =================
const keys={};
function handleKey(k,e){e=e||{preventDefault(){}};
  if(shopOpen){shopKey(k);return;}
  if('1234'.includes(k)&&k.length==1)G.tool=+k-1;
  if(k=='q'){const l=Object.keys(CROPS);G.seedSel=l[(l.indexOf(G.seedSel)+1)%l.length];}
  if(k==' '){e.preventDefault();useTool();}
  if(k=='f5'||k=='p'){e.preventDefault();save();}
  if(k=='l')load(); if(k=='h')showHelp=!showHelp;
  if(k.startsWith('arrow'))e.preventDefault();}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;handleKey(k,e);});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousedown',e=>{const r=cv.getBoundingClientRect(),i=hotbarHit(e.clientX-r.left,e.clientY-r.top);
  if(i>=0&&!shopOpen){G.tool=i;return;}if(!shopOpen)useTool();});
let showHelp=true;try{if(innerWidth<=900||matchMedia('(orientation: portrait)').matches)showHelp=false;}catch(_){}
// ================= TOUCH CONTROLS =================
function detectTouch(){let t=false;
  try{t=t||matchMedia('(pointer: coarse)').matches||matchMedia('(any-pointer: coarse)').matches;}catch(_){}
  try{t=t||('ontouchstart' in window)||navigator.maxTouchPoints>0;}catch(_){}
  try{t=t||innerWidth<=900||matchMedia('(orientation: portrait)').matches||innerHeight>innerWidth;}catch(_){}
  return t;}
let isTouch=false;try{isTouch=detectTouch();}catch(_){isTouch=true;}
let touchInited=false;
const touchKeys={}; // pointerId -> dpad key
// ---- canvas sizing / camera scale ----
let cssW=960,cssH=640,DPR=1,K=3,view={w:60,h:40},cam={x:0,y:0},portraitTouch=false;
function fitCanvas(){const b=document.body,touch=b.classList.contains('touch');
  portraitTouch=touch&&innerHeight>innerWidth;
  cssW=innerWidth;cssH=innerHeight;
  if(portraitTouch&&!b.classList.contains('hidectl'))cssH=Math.max(260,innerHeight-395);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cssW*DPR);cv.height=Math.round(cssH*DPR);cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  document.documentElement.style.setProperty('--ch',cssH+'px');
  // world zoom: 3x (48px tiles) on desktop, ~9 tiles across on portrait phones; integer device-pixel scale for crisp pixels
  const s=portraitTouch?cssW/(9*TS):(cssH<520?Math.max(2,cssH/(11*TS)):3);
  K=Math.max(1,Math.round(s*DPR));view.w=cv.width/K;view.h=cv.height/K;}
addEventListener('resize',fitCanvas);addEventListener('orientationchange',()=>setTimeout(fitCanvas,200));
function dpadAt(x,y){const r=document.getElementById('dpad').getBoundingClientRect(),cx=x-r.left-r.width/2,cy=y-r.top-r.height/2;
  if(Math.hypot(cx,cy)<12||Math.hypot(cx,cy)>r.width)return null;return Math.abs(cx)>Math.abs(cy)?(cx<0?'arrowleft':'arrowright'):(cy<0?'arrowup':'arrowdown');}
function syncDpad(){const act=new Set(Object.values(touchKeys));for(const d of ['arrowup','arrowdown','arrowleft','arrowright']){keys[d]=act.has(d);
  const el=document.querySelector('#dpad [data-d="'+d+'"]');el&&el.classList.toggle('on',act.has(d));}}
function initTouch(){if(touchInited){document.body.classList.add('touch');fitCanvas();return;}touchInited=true;document.body.classList.add('touch');fitCanvas();
  const dp=document.getElementById('dpad');
  dp.addEventListener('pointerdown',e=>{e.preventDefault();try{dp.setPointerCapture(e.pointerId);}catch(_){}touchKeys[e.pointerId]=dpadAt(e.clientX,e.clientY);syncDpad();});
  dp.addEventListener('pointermove',e=>{if(e.pointerId in touchKeys){touchKeys[e.pointerId]=dpadAt(e.clientX,e.clientY);syncDpad();}});
  for(const t of ['pointerup','pointercancel','lostpointercapture'])dp.addEventListener(t,e=>{delete touchKeys[e.pointerId];syncDpad();});
  document.querySelectorAll('#tc [data-k]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');handleKey(b.dataset.k);});
    for(const t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>b.classList.remove('on'));});
  // tap hotbar slots on canvas to pick tool
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();
    const i=hotbarHit(e.clientX-r.left,e.clientY-r.top);if(i>=0&&!shopOpen)G.tool=i;});
  for(const t of ['touchmove','gesturestart','dblclick'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  setInterval(()=>{document.getElementById('shopUI').classList.toggle('show',shopOpen);document.body.classList.toggle('shop',shopOpen);},100);}
let hotRects=[];
function hotbarHit(x,y){for(let i=0;i<hotRects.length;i++){const r=hotRects[i];if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])return i;}return -1;}
function safeInitTouch(){try{initTouch();}catch(err){console.error('initTouch failed',err);document.body.classList.add('touch');}}
fitCanvas();
if(isTouch)safeInitTouch();
addEventListener('resize',()=>{try{if(!document.body.classList.contains('touch')&&detectTouch())safeInitTouch();}catch(_){}});
try{document.getElementById('ctlBtn').addEventListener('click',e=>{e.stopPropagation();const b=document.body;
  if(!b.classList.contains('touch')){b.classList.remove('hidectl');safeInitTouch();}else b.classList.toggle('hidectl');fitCanvas();});}catch(_){}
function front(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[G.p.dir];
  return [Math.floor(G.p.x/TS)+d[0],Math.floor((G.p.y-3)/TS)+d[1]];}
function spend(n){if(G.energy<n){game.msg('Too tired! Go sleep.');return false;}G.energy-=n;return true;}
let fx=[]; // tiny world-space effects (dust / splashes)
function puff(x,y,col,n){for(let i=0;i<n;i++)fx.push({x:x*TS+8,y:y*TS+10,vx:(Math.random()-.5)*30,vy:-Math.random()*30-10,t:0.5,col});}
function useTool(){const [x,y]=front();if(x<0||y<0||x>=W||y>=H)return;const t=map[y][x],k=x+','+y,s=G.soil[k];
  if(G.tool==0){ if(t==8&&!s&&spend(2)){G.soil[k]={wet:false,crop:null,growth:0};puff(x,y,'#8a5a36',8);} }
  else if(G.tool==1){ if(s&&spend(1)){s.wet=true;puff(x,y,'#8fc6ff',10);} }
  else if(G.tool==2){ const si=G.seedSel+'_seed'; if(s&&!s.crop){ if(G.inv[si]>0){G.inv[si]--;s.crop=G.seedSel;s.growth=0;} else game.msg('No '+CROPS[G.seedSel].name+' seeds.');}}
  else { if(t==5){sleep();return;} if(t==6){shopOpen=true;return;}
    if(s&&s.crop&&s.growth>=CROPS[s.crop].days){G.inv[s.crop]++;game.msg('Harvested '+CROPS[s.crop].name+'!');puff(x,y,CROPS[s.crop].color,8);s.crop=null;s.growth=0;return;}
    const pi=G.pickups.findIndex(p=>p.x==x&&p.y==y); if(pi>=0){G.inv[G.pickups[pi].item]++;G.pickups.splice(pi,1);} }
}
function shopKey(k){const l=Object.keys(CROPS);
  if(k=='escape'||k=='e'){shopOpen=false;return;}
  const i=+k-1; if(i>=0&&i<3){const c=CROPS[l[i]];if(G.gold>=c.seedPrice){G.gold-=c.seedPrice;G.inv[l[i]+'_seed']++;game.msg('Bought '+c.name+' seeds.');}else game.msg('Not enough gold.');}
  if(k=='s'){let g=0;for(const c of l){g+=G.inv[c]*CROPS[c].sell;G.inv[c]=0;}for(const it in ITEMS){g+=G.inv[it]*ITEMS[it].sell;G.inv[it]=0;}G.gold+=g;game.msg('Sold goods for '+g+'g.');}}
// ================= UPDATE =================
function snapCam(){cam.x=G.p.x-view.w/2;cam.y=G.p.y-8-view.h/2;clampCam();}
function clampCam(){const mw=W*TS,mh=H*TS;
  cam.x=view.w>=mw?(mw-view.w)/2:Math.max(0,Math.min(mw-view.w,cam.x));
