<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Meadowbrook Acres</title>
<style>body{margin:0;background:#222;color:#eee;font-family:monospace;overflow:hidden}canvas{display:block;margin:0 auto;image-rendering:pixelated}
html,body{height:100%;overscroll-behavior:none}
body.touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
body.touch canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#tc{display:none}body.touch #tc{display:block}
.tb{position:fixed;z-index:5;background:rgba(40,25,15,.6);border:2px solid #e0b070;color:#ffe9b0;border-radius:12px;font:bold 15px monospace;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(224,176,112,.8);color:#222}
#dpad{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:150px;height:150px;z-index:5;touch-action:none}
#dpad .tb{position:absolute;width:50px;height:50px}
#act{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:5}
#act .tb{position:static;width:52px;height:46px;margin:4px}
#bUse{width:76px!important;height:76px!important;border-radius:50%!important;font-size:18px!important}
.row{display:flex;justify-content:flex-end}
#top{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;z-index:5}
#top .tb{position:static;padding:6px 10px;margin-left:6px;border-radius:8px}
#shopUI{display:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6}
#shopUI.show{display:flex}#shopUI .tb{position:static;padding:10px 12px;margin:3px}
@media (orientation:portrait){body.touch canvas{top:0;transform:translateX(-50%)}
body.touch{background:#2a1c10}
#act{width:140px}#act .row{flex-wrap:wrap}#act .tb{width:58px;height:50px}
#bUse{width:120px!important;height:90px!important;border-radius:45px!important;font-size:22px!important}
#dpad{width:168px;height:168px}
#dpad,#act{bottom:calc(28px + env(safe-area-inset-bottom))}
#shopUI{bottom:auto;top:calc(var(--ch,260px) + 8px);flex-wrap:wrap;justify-content:center;width:96vw}
#top{top:calc(var(--ch,260px) + 8px);left:50%;right:auto;transform:translateX(-50%)}
body.shop #top{display:none}}
</style></head>
<body><canvas id="c" width="960" height="640"></canvas>
<div id="tc"><div id="dpad"><div class="tb" data-d="arrowup" style="left:33.3%;top:0">&#9650;</div><div class="tb" data-d="arrowleft" style="left:0;top:33.3%">&#9664;</div><div class="tb" data-d="arrowright" style="left:66.6%;top:33.3%">&#9654;</div><div class="tb" data-d="arrowdown" style="left:33.3%;top:66.6%">&#9660;</div></div>
<div id="act"><div class="row"><div class="tb" data-k="1">Hoe</div><div class="tb" data-k="2">Wtr</div><div class="tb" data-k="3">Seed</div><div class="tb" data-k="4">Hand</div></div>
<div class="row"><div class="tb" data-k="q">Q&#8635;</div><div class="tb" id="bUse" data-k=" ">USE</div></div></div>
<div id="top"><div class="tb" data-k="h">Help</div><div class="tb" data-k="p">Save</div><div class="tb" data-k="l">Load</div></div>
<div id="shopUI"><div class="tb" data-k="1">Buy 1</div><div class="tb" data-k="2">Buy 2</div><div class="tb" data-k="3">Buy 3</div><div class="tb" data-k="s">Sell all</div><div class="tb" data-k="escape">Leave</div></div></div>
<script>
"use strict";
// ================= WEATHER / EVENT SYSTEM (data-driven) =================
// Each day, events are checked in order; the first whose trigger passes becomes today's weather.
// trigger(day, rng) -> bool. particle: null or {color, shape:'drop'|'square'|'flake', count, speed}.
// hooks: onDayStart(game), onTick(game, dt), onTileHit(game) — all optional.
const EVENTS = [
  { id:'chocolate', name:'Chocolate Rain', tint:'rgba(90,50,20,0.18)',
    trigger:(day,r)=> day>2 && r<0.08,
    particle:{color:'#6b3a1a', shape:'drop', count:140, speed:9},
    onDayStart:g=>{ waterAll(g); for(let i=0;i<6;i++) spawnPickup(g,'chocolate'); g.msg('Chocolate rain! Collect the treats.'); },
    onTick:(g,dt)=>{ if(Math.random()<dt*0.02) spawnPickup(g,'chocolate'); } },
  { id:'rain', name:'Rain', tint:'rgba(30,40,80,0.22)',
    trigger:(day,r)=> r<0.3,
    particle:{color:'#9cc4ff', shape:'drop', count:160, speed:10},
    onDayStart:g=>{ waterAll(g); g.msg('Rain today - crops are watered.'); } },
  { id:'sunny', name:'Sunny', tint:null, trigger:()=>true, particle:null }
];
// ================= DATA =================
const CROPS = {
  radish:{name:'Radish', seedPrice:20, sell:45, days:3, color:'#e33a5a'},
  corn:  {name:'Corn',   seedPrice:40, sell:100,days:5, color:'#f2d23a'},
  melon: {name:'Melon',  seedPrice:80, sell:260,days:7, color:'#3fae4a'}
};
const ITEMS = {chocolate:{name:'Chocolate', sell:60, color:'#5a2e12'}};
const TS=32, W=40, H=26, cv=document.getElementById('c'), ctx=cv.getContext('2d');
// tiles: 0 grass,1 path,2 water,3 wall,4 floor,5 bed,6 counter,7 tree,8 farmland(tillable grass),9 door
let map=[];
function buildMap(){
  map=[];for(let y=0;y<H;y++){map.push([]);for(let x=0;x<W;x++){let t=0;
    if(x==0||y==0||x==W-1||y==H-1)t=7;
    if(x>=3&&x<=16&&y>=10&&y<=22)t=8;
    if(y==8&&x>0&&x<W-1)t=1; if(x==22&&y>0&&y<H-1)t=1;
    if(x>=34&&x<=37&&y>=18&&y<=22)t=2;
    map[y].push(t);}}
  rect(3,2,8,6,3,4); map[6][6]=9; map[3][4]=5; map[3][5]=5;   // house + bed
  rect(26,2,9,6,3,4); map[6][30]=9; for(let x=28;x<=32;x++)map[4][x]=6; // shop + counter
  for(let x=24;x<38;x+=3){map[12][x]=7;} map[7][6]=1; map[7][30]=1;
}
function rect(x0,y0,w,h,wall,floor){for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)
  map[y][x]=(x==x0||y==y0||x==x0+w-1||y==y0+h-1)?wall:floor;}
const SOLID=new Set([2,3,6,7,5]);
// ================= STATE =================
let G;
function newGame(){ buildMap(); G={day:1,time:6*60,gold:150,energy:100,maxE:100,
  p:{x:6*TS+16,y:9*TS+16,dir:'down'}, tool:0, soil:{}, pickups:[],
  inv:{radish_seed:5,corn_seed:0,melon_seed:0,radish:0,corn:0,melon:0,chocolate:0}, seedSel:'radish',
  weather:'sunny'}; startDay(); }
const game={msg(t){msgT=t;msgTime=3;}};
let msgT='',msgTime=0,shopOpen=false,particles=[];
function ev(){return EVENTS.find(e=>e.id==G.weather)||EVENTS[EVENTS.length-1];}
function waterAll(){for(const k in G.soil)G.soil[k].wet=true;}
function spawnPickup(g,item){for(let n=0;n<30;n++){const x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));
  if([0,1,8].includes(map[y][x])&&!G.soil[x+','+y]){G.pickups.push({x,y,item});return;}}}
function startDay(){ G.pickups=G.pickups.filter(p=>false); const r=Math.random();
  const e=EVENTS.find(e=>e.trigger(G.day,r)); G.weather=e.id; e.onDayStart&&e.onDayStart(game); initParticles(); }
function initParticles(){particles=[];const p=ev().particle;if(p)for(let i=0;i<p.count;i++)particles.push({x:Math.random()*cv.width,y:Math.random()*cv.height});}
function sleep(){ // grow crops
  for(const k in G.soil){const s=G.soil[k];if(s.crop&&s.wet&&s.growth<CROPS[s.crop].days)s.growth++;s.wet=false;}
  const pass=G.time>=26*60; G.day++; G.time=6*60; G.energy=pass?Math.floor(G.maxE*0.6):G.maxE;
  startDay(); save(true); game.msg('Day '+G.day+' - '+ev().name+(pass?' (you passed out)':''));}
function save(q){localStorage.setItem('meadowbrook_save',JSON.stringify(G));if(!q)game.msg('Game saved.');}
function load(){const s=localStorage.getItem('meadowbrook_save');if(!s){game.msg('No save found.');return false;}
  buildMap();G=JSON.parse(s);initParticles();game.msg('Game loaded.');return true;}
// ================= INPUT =================
const keys={};
function handleKey(k,e){e=e||{preventDefault(){}};
  if(shopOpen){shopKey(k);return;}
  if('1234'.includes(k)&&k.length==1)G.tool=+k-1;
  if(k=='q'){const l=Object.keys(CROPS);G.seedSel=l[(l.indexOf(G.seedSel)+1)%l.length];}
  if(k==' '){e.preventDefault();useTool();}
  if(k=='f5'||k=='p'){e.preventDefault();save();}
  if(k=='l')load(); if(k=='h')showHelp=!showHelp;
  if(k.startsWith('arrow'))e.preventDefault();}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;handleKey(k,e);});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
cv.addEventListener('mousedown',()=>{if(!shopOpen)useTool();});
let showHelp=true;
// ================= TOUCH CONTROLS =================
const isTouch=matchMedia('(pointer: coarse)').matches||'ontouchstart' in window||navigator.maxTouchPoints>0;
const touchKeys={}; // pointerId -> dpad key
function fitCanvas(){if(!document.body.classList.contains('touch'))return;const s=Math.min(innerWidth/cv.width,innerHeight/cv.height);
  cv.style.width=Math.floor(cv.width*s)+'px';cv.style.height=Math.floor(cv.height*s)+'px';
  document.documentElement.style.setProperty('--ch',Math.floor(cv.height*s)+'px');}
function dpadAt(x,y){const r=document.getElementById('dpad').getBoundingClientRect(),cx=x-r.left-r.width/2,cy=y-r.top-r.height/2;
  if(Math.hypot(cx,cy)<12||Math.hypot(cx,cy)>r.width)return null;return Math.abs(cx)>Math.abs(cy)?(cx<0?'arrowleft':'arrowright'):(cy<0?'arrowup':'arrowdown');}
function syncDpad(){const act=new Set(Object.values(touchKeys));for(const d of ['arrowup','arrowdown','arrowleft','arrowright']){keys[d]=act.has(d);
  const el=document.querySelector('#dpad [data-d="'+d+'"]');el&&el.classList.toggle('on',act.has(d));}}
function initTouch(){document.body.classList.add('touch');fitCanvas();addEventListener('resize',fitCanvas);addEventListener('orientationchange',()=>setTimeout(fitCanvas,200));
  const dp=document.getElementById('dpad');
  dp.addEventListener('pointerdown',e=>{e.preventDefault();try{dp.setPointerCapture(e.pointerId);}catch(_){}touchKeys[e.pointerId]=dpadAt(e.clientX,e.clientY);syncDpad();});
  dp.addEventListener('pointermove',e=>{if(e.pointerId in touchKeys){touchKeys[e.pointerId]=dpadAt(e.clientX,e.clientY);syncDpad();}});
  for(const t of ['pointerup','pointercancel','lostpointercapture'])dp.addEventListener(t,e=>{delete touchKeys[e.pointerId];syncDpad();});
  document.querySelectorAll('#tc [data-k]').forEach(b=>{
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');handleKey(b.dataset.k);});
    for(const t of ['pointerup','pointercancel','pointerleave'])b.addEventListener(t,()=>b.classList.remove('on'));});
  // tap hotbar slots on canvas to pick tool
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;
    const i=hotbarHit(x,y);if(i>=0&&!shopOpen)G.tool=i;});
  for(const t of ['touchmove','gesturestart','dblclick'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  setInterval(()=>document.getElementById('shopUI').classList.toggle('show',shopOpen),document.body.classList.toggle('shop',shopOpen),100);}
function hotbarHit(x,y){const bx=cv.width/2-170,by=cv.height-60;if(y<by||y>by+52)return -1;for(let i=0;i<4;i++)if(x>=bx+i*58&&x<=bx+i*58+52)return i;return -1;}
if(isTouch)initTouch();
function front(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[G.p.dir];
  return [Math.floor(G.p.x/TS)+d[0],Math.floor(G.p.y/TS)+d[1]];}
function spend(n){if(G.energy<n){game.msg('Too tired! Go sleep.');return false;}G.energy-=n;return true;}
function useTool(){const [x,y]=front();if(x<0||y<0||x>=W||y>=H)return;const t=map[y][x],k=x+','+y,s=G.soil[k];
  if(G.tool==0){ if(t==8&&!s&&spend(2))G.soil[k]={wet:false,crop:null,growth:0}; }
  else if(G.tool==1){ if(s&&spend(1))s.wet=true; }
  else if(G.tool==2){ const si=G.seedSel+'_seed'; if(s&&!s.crop){ if(G.inv[si]>0){G.inv[si]--;s.crop=G.seedSel;s.growth=0;} else game.msg('No '+CROPS[G.seedSel].name+' seeds.');}}
  else { if(t==5){sleep();return;} if(t==6){shopOpen=true;return;}
    if(s&&s.crop&&s.growth>=CROPS[s.crop].days){G.inv[s.crop]++;game.msg('Harvested '+CROPS[s.crop].name+'!');s.crop=null;s.growth=0;return;}
    const pi=G.pickups.findIndex(p=>p.x==x&&p.y==y); if(pi>=0){G.inv[G.pickups[pi].item]++;G.pickups.splice(pi,1);} }
}
function shopKey(k){const l=Object.keys(CROPS);
  if(k=='escape'||k=='e'){shopOpen=false;return;}
  const i=+k-1; if(i>=0&&i<3){const c=CROPS[l[i]];if(G.gold>=c.seedPrice){G.gold-=c.seedPrice;G.inv[l[i]+'_seed']++;game.msg('Bought '+c.name+' seeds.');}else game.msg('Not enough gold.');}
  if(k=='s'){let g=0;for(const c of l){g+=G.inv[c]*CROPS[c].sell;G.inv[c]=0;}for(const it in ITEMS){g+=G.inv[it]*ITEMS[it].sell;G.inv[it]=0;}G.gold+=g;game.msg('Sold goods for '+g+'g.');}}
// ================= UPDATE =================
function update(dt){
  if(msgTime>0)msgTime-=dt; if(shopOpen)return;
  G.time+=dt*10; if(G.time>=26*60){game.msg('You collapsed from exhaustion...');sleep();}
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']){dy=-1;G.p.dir='up';} if(keys['s']||keys['arrowdown']){dy=1;G.p.dir='down';}
  if(keys['a']||keys['arrowleft']){dx=-1;G.p.dir='left';} if(keys['d']||keys['arrowright']){dx=1;G.p.dir='right';}
  const sp=140*dt; tryMove(dx*sp,0); tryMove(0,dy*sp);
  const e=ev(); e.onTick&&e.onTick(game,dt);
  const p=e.particle; if(p)for(const q of particles){q.y+=p.speed*60*dt;q.x-=p.speed*15*dt;if(q.y>cv.height){q.y=-10;q.x=Math.random()*cv.width*1.2;}}
  // auto pickup when walking over
  const px=Math.floor(G.p.x/TS),py=Math.floor(G.p.y/TS);
  G.pickups=G.pickups.filter(pk=>{if(pk.x==px&&pk.y==py){G.inv[pk.item]++;game.msg('+1 '+ITEMS[pk.item].name);return false;}return true;});
}
function blocked(x,y){const r=10;for(const [cx,cy] of [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){
  const tx=Math.floor(cx/TS),ty=Math.floor(cy/TS);if(tx<0||ty<0||tx>=W||ty>=H||SOLID.has(map[ty][tx]))return true;}return false;}
function tryMove(dx,dy){if(!blocked(G.p.x+dx,G.p.y+dy)){G.p.x+=dx;G.p.y+=dy;}}
// ================= RENDER =================
function drawTile(t,sx,sy,x,y){const h=((x*73856093)^(y*19349663))>>>0;
  const fill=(c,a,b,w,hh)=>{ctx.fillStyle=c;ctx.fillRect(sx+a,sy+b,w,hh);};
  if(t==0||t==8){fill(t==8?'#5fa040':'#68ad48',0,0,TS,TS);fill('#4f8f36',h%28,(h>>5)%28,3,3);fill('#7cc35a',(h>>9)%28,(h>>13)%28,2,4);}
  else if(t==1){fill('#c8a96b',0,0,TS,TS);fill('#b39257',h%26,(h>>4)%26,4,3);}
  else if(t==2){fill('#3b78c4',0,0,TS,TS);fill('#6fa5e6',(h+Date.now()/80|0)%24,(h>>5)%24,8,2);}
  else if(t==3){fill('#8a5a3a',0,0,TS,TS);fill('#6e4329',0,TS/2,TS,2);fill('#6e4329',(y%2)*16,0,2,TS);}
  else if(t==4||t==9){fill(t==9?'#5a3a22':'#c99a62',0,0,TS,TS);fill('#b0824d',0,(y%2)*16+8,TS,1);}
  else if(t==5){fill('#c99a62',0,0,TS,TS);fill('#7a4a2a',2,2,TS-4,TS-4);fill('#e8e0d0',4,4,TS-8,10);fill('#3a6ec9',4,14,TS-8,TS-18);}
  else if(t==6){fill('#c99a62',0,0,TS,TS);fill('#7d4f2d',0,6,TS,TS-6);fill('#a36a3e',0,6,TS,5);}
  else if(t==7){fill('#68ad48',0,0,TS,TS);fill('#6b4423',13,18,6,12);ctx.fillStyle='#2f7a34';ctx.beginPath();ctx.arc(sx+16,sy+13,12,0,7);ctx.fill();fill('#45984a',9,6,6,5);}
}
function drawCrop(s,sx,sy){const c=CROPS[s.crop],st=s.growth/c.days;ctx.fillStyle='#3e9a2e';
  if(st<0.34){ctx.fillRect(sx+14,sy+18,4,6);ctx.fillRect(sx+11,sy+16,4,3);ctx.fillRect(sx+17,sy+16,4,3);}
  else if(st<1){ctx.fillRect(sx+15,sy+8,3,18);ctx.fillRect(sx+8,sy+12,8,4);ctx.fillRect(sx+17,sy+16,8,4);}
  else{ctx.fillRect(sx+15,sy+6,3,20);ctx.fillRect(sx+8,sy+14,8,4);ctx.fillRect(sx+17,sy+10,8,4);
    ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(sx+16,sy+10,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(sx+13,sy+7,2,2);}}
function render(){
  const cam={x:Math.max(0,Math.min(W*TS-cv.width,G.p.x-cv.width/2)),y:Math.max(0,Math.min(H*TS-cv.height+64,G.p.y-cv.height/2))};
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const sx=x*TS-cam.x|0,sy=y*TS-cam.y|0;if(sx<-TS||sy<-TS||sx>cv.width||sy>cv.height)continue;
    drawTile(map[y][x],sx,sy,x,y);const s=G.soil[x+','+y];
    if(s){ctx.fillStyle=s.wet?'#4a2e1a':'#8b5a33';ctx.fillRect(sx+2,sy+2,TS-4,TS-4);ctx.fillStyle=s.wet?'#3a2214':'#74482a';for(let i=0;i<3;i++)ctx.fillRect(sx+4,sy+8+i*8,TS-8,2);if(s.crop)drawCrop(s,sx,sy);}}
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('HOME',3*TS+16-cam.x,2*TS-4-cam.y);ctx.fillText('GENERAL STORE',26*TS+60-cam.x,2*TS-4-cam.y);
  for(const pk of G.pickups){const sx=pk.x*TS-cam.x,sy=pk.y*TS-cam.y;ctx.fillStyle=ITEMS[pk.item].color;ctx.fillRect(sx+9,sy+12+Math.sin(Date.now()/200)*2,14,9);ctx.fillStyle='#8a4a22';ctx.fillRect(sx+11,sy+14+Math.sin(Date.now()/200)*2,4,3);}
  // target highlight
  const [fx,fy]=front();ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.strokeRect(fx*TS-cam.x+1,fy*TS-cam.y+1,TS-2,TS-2);
  // player
  const px=G.p.x-cam.x,py=G.p.y-cam.y,bob=(keys.w||keys.a||keys.s||keys.d||keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright)?Math.sin(Date.now()/90)*2:0;
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(px-9,py+10,18,4);
  ctx.fillStyle='#2b4f8f';ctx.fillRect(px-7,py+2+bob,14,10);ctx.fillStyle='#d89a6a';ctx.fillRect(px-6,py-10+bob,12,12);
  ctx.fillStyle='#a8452a';ctx.fillRect(px-8,py-13+bob,16,5);ctx.fillStyle='#222';
  if(G.p.dir!='up'){const o={down:0,left:-3,right:3}[G.p.dir];ctx.fillRect(px-4+o,py-5+bob,2,2);ctx.fillRect(px+2+o,py-5+bob,2,2);}
  // weather
  const e=ev();if(e.particle){ctx.fillStyle=e.particle.color;for(const q of particles){if(e.particle.shape=='drop')ctx.fillRect(q.x,q.y,2,8);else ctx.fillRect(q.x,q.y,4,4);}}
  if(e.tint){ctx.fillStyle=e.tint;ctx.fillRect(0,0,cv.width,cv.height);}
  const hr=G.time/60;if(hr>18){ctx.fillStyle='rgba(10,10,50,'+Math.min(0.5,(hr-18)/8)+')';ctx.fillRect(0,0,cv.width,cv.height);}
  drawHUD();}
function panel(x,y,w,h){ctx.fillStyle='rgba(40,25,15,0.85)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#e0b070';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);}
function drawHUD(){ctx.font='14px monospace';
  const h=Math.floor(G.time/60)%24,m=Math.floor(G.time%60/10)*10;
  panel(cv.width-210,8,200,78);ctx.fillStyle='#fff';ctx.fillText('Day '+G.day+'  '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),cv.width-200,28);
  ctx.fillText('Weather: '+ev().name,cv.width-200,48);ctx.fillStyle='#ffd84a';ctx.fillText('Gold: '+G.gold+'g',cv.width-200,68);
  panel(cv.width-40,96,30,110);ctx.fillStyle='#333';ctx.fillRect(cv.width-32,104,14,94);const eh=94*G.energy/G.maxE;
  ctx.fillStyle=G.energy>30?'#5ad05a':'#e05a3a';ctx.fillRect(cv.width-32,104+94-eh,14,eh);ctx.fillStyle='#fff';ctx.fillText('E',cv.width-29,220);
  // hotbar
  const tools=['Hoe','Water','Seeds','Hand'],bx=cv.width/2-170,by=cv.height-60;
  for(let i=0;i<4;i++){panel(bx+i*58,by,52,52);if(G.tool==i){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(bx+i*58,by,52,52);}drawToolIcon(i,bx+i*58+14,by+8);
    ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.fillText((i+1)+' '+tools[i],bx+i*58+3,by+48);}
  panel(bx+236,by,200,52);ctx.font='11px monospace';let yy=by+14,xx=bx+242;
  for(const c in CROPS){ctx.fillStyle=G.seedSel==c?'#ffd84a':'#fff';ctx.fillText(CROPS[c].name+' seed:'+G.inv[c+'_seed']+' crop:'+G.inv[c],xx,yy);yy+=13;}
  ctx.fillStyle='#fff';ctx.fillText('Chocolate:'+G.inv.chocolate,xx,yy);
  if(showHelp){panel(8,8,290,186);ctx.fillStyle='#fff';ctx.font='12px monospace';
    ['CONTROLS (H to hide)','WASD/Arrows: move','1-4: Hoe/Water/Seeds/Hand','Space/Click: use tool on tile ahead','Q: cycle seed type','Hand on bed: sleep (ends day)','Hand on store counter: shop','P: save   L: load','Till farm soil, plant, water daily.','Crops grow 1 stage per watered day.']
    .forEach((t,i)=>ctx.fillText(t,16,26+i*17));}
  if(msgTime>0){ctx.font='14px monospace';const w=ctx.measureText(msgT).width+20;panel(cv.width/2-w/2,cv.height-100,w,28);ctx.fillStyle='#fff';ctx.fillText(msgT,cv.width/2-w/2+10,cv.height-81);}
  if(shopOpen){panel(cv.width/2-200,150,400,220);ctx.fillStyle='#ffd84a';ctx.font='bold 16px monospace';ctx.fillText('GENERAL STORE  (gold: '+G.gold+'g)',cv.width/2-185,178);
    ctx.font='14px monospace';ctx.fillStyle='#fff';let i=1;for(const c in CROPS){const k=CROPS[c];ctx.fillText(i+++') Buy '+k.name+' seed  '+k.seedPrice+'g  ('+k.days+' days, sells '+k.sell+'g)',cv.width/2-185,210+(i-2)*24);}
    ctx.fillText('S) Sell all crops & chocolate',cv.width/2-185,300);ctx.fillText('E / Esc) Leave',cv.width/2-185,330);}}
function drawToolIcon(i,x,y){const f=(c,a,b,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x+a,y+b,w,h);};
  if(i==0){f('#8a5a2b',10,4,4,22);f('#aaa',2,2,14,6);}
  else if(i==1){f('#5a8acb',2,10,18,14);f('#5a8acb',18,6,8,4);f('#3a6aab',6,6,10,4);}
  else if(i==2){f('#c9a66b',4,6,18,20);f(CROPS[G.seedSel].color,9,12,8,8);}
  else{f('#d89a6a',4,8,16,16);f('#d89a6a',4,2,4,8);f('#d89a6a',10,0,4,10);f('#d89a6a',16,2,4,8);}}
// ================= LOOP =================
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop);}
newGame(); if(localStorage.getItem('meadowbrook_save'))load(); requestAnimationFrame(loop);
</script></body></html>
