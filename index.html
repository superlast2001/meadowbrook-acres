"use strict";
// ================= WEATHER / EVENT SYSTEM (data-driven) =================
// Each day, events are checked in order; the first whose trigger passes becomes today's weather.
// trigger(day, rng) -> bool. particle: null or {color, shape:'drop'|'square'|'flake', count, speed}.
// hooks: onDayStart(game), onTick(game, dt), onTileHit(game) — all optional.
const EVENTS = [
  { id:'chocolate', name:'Chocolate Rain', tint:'rgba(90,50,20,0.18)',
    trigger:(day,r)=> day>2 && r<0.08,
    particle:{color:'#6b3a1a', shape:'drop', count:140, speed:9},
    onDayStart:g=>{ waterAll(g); for(let i=0;i<6;i++) spawnPickup(g,'chocolate'); g.msg('Chocolate rain! Collect the treats.'); },
    onTick:(g,dt)=>{ if(Math.random()<dt*0.02) spawnPickup(g,'chocolate'); } },
  { id:'rain', name:'Rain', tint:'rgba(30,40,80,0.22)',
    trigger:(day,r)=> season()!='winter' && r<(season()=='summer'?0.15:0.3),
    particle:{color:'#9cc4ff', shape:'drop', count:160, speed:10},
    onDayStart:g=>{ waterAll(g); g.msg('Rain today - crops are watered.'); } },
  { id:'snow', name:'Snow', tint:'rgba(200,220,255,0.10)', trigger:(day,r)=> season()=='winter' && r<0.45,
    particle:{color:'#ffffff', shape:'flake', count:130, speed:3}, onDayStart:g=>{ g.msg('Snow is falling - crops rest in winter.'); } },
  { id:'sunny', name:'Sunny', tint:null, trigger:()=>true, particle:null }
];

// To plug in a real model later, either set AI.endpoint to an OpenAI-compatible chat endpoint,
// or define window.MEADOW_AI = async (req) => 'reply text'. req = {npc, topic, persona, memory, context, fallback}.
// The scripted line is shown immediately; an AI reply (if any) replaces it when it arrives.
const AI={endpoint:'',model:'',headers:{},timeoutMs:6000};
function aiEnabled(){return typeof window.MEADOW_AI=='function'||!!AI.endpoint;}
async function aiReply(req){
  if(typeof window.MEADOW_AI=='function')return await window.MEADOW_AI(req);
  if(!AI.endpoint)return null;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),AI.timeoutMs);
  try{const r=await fetch(AI.endpoint,{method:'POST',signal:ctl.signal,headers:Object.assign({'Content-Type':'application/json'},AI.headers),
      body:JSON.stringify({model:AI.model,messages:[{role:'system',content:req.persona},{role:'user',content:JSON.stringify({topic:req.topic,context:req.context,memory:req.memory})}]})});
    const d=await r.json();return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||d.reply||null;}
  finally{clearTimeout(tm);}}
const PERSONA={rzel:"You are Rzel, the masked, muscular, half-cyber-armored shopkeeper of Meadowbrook Acres. Charming, confident, playful, flirty but wholesome and never sexual. Short replies (1-2 sentences). Loves chocolate.",

function aiSay(id,topic,fallback){if(!dlg)return;dlg.text=fallback;if(!aiEnabled())return;const myDlg=dlg;dlg.text=fallback+' ...';
  aiReply({npc:id,topic,persona:PERSONA[id],memory:relOf(id).mem||{},context:dayCtx(),fallback})
    .then(t=>{if(dlg===myDlg)dlg.text=t?String(t).slice(0,260):fallback;}).catch(()=>{if(dlg===myDlg)dlg.text=fallback;});}

const SEASONS=['spring','summer','fall','winter'];let SEAS='spring';
function season(){return (G&&G.seasonSet)||SEASONS[Math.floor((((G?G.day:1)-1)/28))%4];}
function dayOfSeason(){return ((G.day-1)%28)+1;}
function isHalloween(){return (season()=='fall'&&dayOfSeason()==27)||G.hwDay==G.day;}
function cap1(s){return s[0].toUpperCase()+s.slice(1);}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!=mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx==r?(g-b)/d+(g<b?6:0):mx==g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;if(s==0)return [l*255,l*255,l*255];const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q;
  const f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};return [f(h+1/3)*255,f(h)*255,f(h-1/3)*255];}
function makeSeasonal(){for(const k of Object.keys(SPR)){if(k.includes('@'))continue;const cat=/^(grass_|edge_)/.test(k)?'g':/^pine/.test(k)?'p':/^(tree_|bush_)/.test(k)?'t':null;if(!cat)continue;
  const src=SPR[k];for(const se of ['summer','fall','winter']){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);
    const im=x.getImageData(0,0,c.width,c.height),d=im.data;
    for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;let [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);if(!(h>=55&&h<=175&&s>0.12))continue;
      if(se=='summer'){h-=7;s=Math.min(1,s*1.2);l*=0.96;}
      else if(se=='fall'){if(cat=='g'){h=42+(h-60)*0.12;s*=0.8;}else if(cat=='t'){h=14+(h-60)*0.3;s=Math.min(1,s*1.15);}else{s*=0.8;h-=8;}}
      else{if(cat=='g'){h=205;s*=0.18;l=0.78+l*0.2;}else if(cat=='t'){h=30;s*=0.2;l=l*0.55+0.25;}else{s*=0.55;l=l*0.85+0.08;}}
      const [r,g,b]=hsl2rgb(h,s,Math.min(1,l));d[i]=r;d[i+1]=g;d[i+2]=b;}
    x.putImageData(im,0,0);SPR[k+'@'+se]=c;}}}
function drawS(k,x,y){const s=(SEAS!='spring'&&SPR[k+'@'+SEAS])||SPR[k];if(s)ctx.drawImage(s,Math.round(x),Math.round(y));}

// ---------- NPCs & daily schedules ----------
const SPOTS={counter:[40,8],shopFloor:[38,13],shopFloor2:[42,13],rzHome:[39,37],porch:[18,17],fhHome:[18,12],fhBed:[17,13],
  plaza:[37,18],plaza2:[42,18],pondN:[45,24],pondS:[45,33],garden:[54,15],mHome:[53,11],pHome:[51,11],aHome:[31,37],aTrain:[39,20],aPatrol:[48,22]};
const NPCDEF={
  rzel:{name:'Rzel',h:32},
  mabel:{name:'Mabel',h:23,sheet:'mabel_sheet'},
  pip:{name:'Pip',h:19,sheet:'pip_sheet'},
  ares:{name:'Ares',h:30,sheet:'ares_world',portrait:true}};
// [start minute, spot, activity]  activity: stand | wander | work | sleep | fish | candy
function schedule(id){const wet=G.weather=='rain'||G.weather=='chocolate'||G.weather=='snow',hw=isHalloween(),R=relOf('rzel');
  if(id=='rzel'){
    if(R.married)return [[0,'fhBed','sleep'],[360,'fhHome','stand'],[500,'counter','work'],[1020,hw?'plaza':'porch',hw?'candy':'wander'],[1200,'fhHome','stand'],[1320,'fhBed','sleep']];
    if(hw)return [[0,'rzHome','sleep'],[360,'rzHome','stand'],[480,'counter','work'],[1020,'plaza','candy'],[1320,'rzHome','sleep']];
    if(wet)return [[0,'rzHome','sleep'],[360,'rzHome','stand'],[480,'counter','work'],[1020,'shopFloor','wander'],[1260,'rzHome','sleep']];
    return [[0,'rzHome','sleep'],[360,'rzHome','stand'],[480,'counter','work'],[1020,'pondN','wander'],[1200,'plaza','wander'],[1320,'rzHome','sleep']];}
  if(id=='mabel')return [[0,'mHome','sleep'],[420,'mHome','stand'],[480,wet?'mHome':'garden','wander'],[720,wet?'shopFloor':'plaza','wander'],[960,wet?'shopFloor':'pondN','wander'],[1140,'mHome','stand'],[1260,'mHome','sleep']];
  if(id=='pip')return [[0,'pHome','sleep'],[450,'pHome','stand'],[540,wet?'shopFloor2':'pondS',wet?'wander':'fish'],[930,hw?'plaza':'plaza2','wander'],[1110,'pHome','stand'],[1200,'pHome','sleep']];
  if(id=='ares'){const Ra=relOf('ares');
    if(Ra.married)return [[0,'fhBed','sleep'],[360,'fhHome','stand'],[480,'aTrain','wander'],[720,'aPatrol','wander'],[960,'shopFloor','wander'],[1140,'fhHome','stand'],[1260,'fhBed','sleep']];
    return [[0,'aHome','sleep'],[360,'aHome','stand'],[480,wet?'aHome':'aTrain','wander'],[720,wet?'shopFloor':'aPatrol','wander'],[960,wet?'shopFloor2':'plaza','wander'],[1140,'aHome','stand'],[1260,'aHome','sleep']];}
  return [];}
function schedNow(id){const s=schedule(id);let cur=s[0];for(const e of s)if(G.time>=e[0])cur=e;return cur;}
const RT={rzel:{},mabel:{},pip:{},ares:{}};   // runtime-only state (paths, timers); not saved
function npcObj(id){if(id=='rzel')return rzS();if(!G.vill)G.vill={};if(!G.vill[id]||!isFinite(G.vill[id].x)){const s=SPOTS[schedNow(id)[1]];G.vill[id]={x:s[0]*TS+8,y:s[1]*TS+12,dir:'down'};}return G.vill[id];}
function npcScheduled(id){return id!='rzel'||rzS().mode=='counter';}
function walkable(t){return !SOLID.has(t)||t==18||t==9;}
function bfs(sx,sy,tx,ty){if(sx==tx&&sy==ty)return [];const key=(x,y)=>y*W+x,prev=new Int32Array(W*H).fill(-1),q=[key(sx,sy)];prev[key(sx,sy)]=key(sx,sy);
  for(let i=0;i<q.length;i++){const k=q[i],x=k%W,y=(k/W)|0;if(x==tx&&y==ty){const p=[];let c=k;while(c!=key(sx,sy)){p.push([c%W,(c/W)|0]);c=prev[c];}return p.reverse();}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=key(nx,ny);if(prev[nk]>=0||!walkable(map[ny][nx]))continue;prev[nk]=k;q.push(nk);}}
  return null;}
function npcTile(o){return [Math.floor(o.x/TS),Math.floor((o.y-2)/TS)];}
function npcSnap(id){if(!npcScheduled(id))return;const o=npcObj(id),e=schedNow(id),s=SPOTS[e[1]];o.x=s[0]*TS+8;o.y=s[1]*TS+12;o.dir='down';
  const rt=RT[id];rt.lock=null;rt.path=[];rt.spot=e[1]+e[0];rt.hidden=e[2]=='sleep';rt.wT=2+Math.random()*3;if(id=='rzel'&&e[2]=='work'){o.x=HOME_X;o.y=HOME_Y;}}
function npcSnapAll(){for(const id in NPCDEF)npcSnap(id);}
let npcLastT=null,npcLastDay=null;
function updateNPCs(dt){
  if(npcLastT===null||Math.abs(G.time-npcLastT)>25||npcLastDay!==G.day){npcSnapAll();}npcLastT=G.time;npcLastDay=G.day;
  const r=rzS();if((r.mode=='follow'||r.mode=='stay')&&G.time>=1380&&!relOf('rzel').married){r.mode='counter';RT.rzel.spot=null;say('rzel',"It's getting late, farmer. I'm heading home - sweet dreams!",4);}
  if((r.mode=='follow'||r.mode=='stay')&&relOf('rzel').married&&G.time>=1380){r.mode='counter';RT.rzel.spot=null;say('rzel',"Let's head home together, love.",4);}
  for(const id in NPCDEF){const rt=RT[id];if(!npcScheduled(id)){rt.hidden=false;continue;}const o=npcObj(id),e=schedNow(id),key=e[1]+e[0];
    if(rt.lock!=null){if(Math.abs(G.time-rt.lock)<90){rt.moving=false;continue;}rt.lock=null;}
    if(rt.spot!==key){rt.spot=key;const s=SPOTS[e[1]],[tx,ty]=npcTile(o);rt.path=bfs(tx,ty,s[0],s[1])||[];if(!rt.path.length&&(tx!=s[0]||ty!=s[1])){o.x=s[0]*TS+8;o.y=s[1]*TS+12;}rt.hidden=false;rt.wT=1+Math.random()*3;}
    let moved=0;
    if(rt.path&&rt.path.length){const [nx,ny]=rt.path[0],gx=nx*TS+8,gy=ny*TS+12,dx=gx-o.x,dy=gy-o.y,l=Math.hypot(dx,dy),sp=46*dt*(CHEAT.speed?2:1);
      if(l<=sp){o.x=gx;o.y=gy;rt.path.shift();}else{o.x+=dx/l*sp;o.y+=dy/l*sp;}moved=Math.min(l,sp);
      if(Math.abs(dx)>Math.abs(dy)*1.2)o.dir=dx<0?'left':'right';else if(l>0.1)o.dir=dy<0?'up':'down';}
    else{ // arrived
      if(e[2]=='sleep')rt.hidden=true;
      else if(e[2]=='work'){if(id=='rzel'){o.x+=(HOME_X-o.x)*Math.min(1,dt*6);o.y+=(HOME_Y-o.y)*Math.min(1,dt*6);}o.dir='down';}
      else if(e[2]=='wander'||e[2]=='candy'){rt.wT-=dt;if(rt.wT<=0){rt.wT=3+Math.random()*5;const s=SPOTS[e[1]],[tx,ty]=npcTile(o);
        for(let k=0;k<8;k++){const ax=s[0]+Math.round((Math.random()-.5)*6),ay=s[1]+Math.round((Math.random()-.5)*4);if(ax<0||ay<0||ax>=W||ay>=H||!walkable(map[ay][ax]))continue;
          if(bldAt(ax,ay)!==bldAt(s[0],s[1]))continue;const p=bfs(tx,ty,ax,ay);if(p&&p.length<=10){rt.path=p;break;}}}
        else if(Math.random()<dt*0.3){const px=G.p.x-o.x,py=G.p.y-o.y;if(Math.hypot(px,py)<60)o.dir=Math.abs(px)>Math.abs(py)?(px<0?'left':'right'):(py<0?'up':'down');}}
      else if(e[2]=='fish')o.dir='down';
      else o.dir=o.dir||'down';}
    rt.moving=moved>0.01;rt.walk=(rt.walk||0)+moved;
    if(id=='rzel'){rzMoving=rt.moving;if(rt.moving)rzWalk+=moved;}}
  // idle chatter
  for(const id in NPCDEF){const rt=RT[id];rt.chatT=(rt.chatT===undefined?8+Math.random()*12:rt.chatT)-dt;
    if(rt.chatT<=0){rt.chatT=18+Math.random()*24;const o=npcObj(id);if(!rt.hidden&&Math.hypot(o.x-G.p.x,o.y-G.p.y)<TS*7&&!bubbles[id])say(id,ambientLine(id),4);}}}
function rzAtCounter(){const r=rzS();return r.mode=='counter'&&!RT.rzel.hidden&&schedNow('rzel')[2]=='work'&&Math.hypot(r.x-HOME_X,r.y-HOME_Y)<6;}
function shopIsOpen(){return rzAtCounter()&&G.time>=480&&G.time<1020;}
function shopClosedMsg(){const h=G.time/60;return h<8?'Shop opens at 8am. (Rzel is still at home.)':h>=17?'Shop closed for the day (8am-5pm).':'Rzel is out. (Sign: "Back soon!")';}
function npcAt(tx,ty){for(const id in NPCDEF){if(RT[id].hidden)continue;const o=npcObj(id),cx=tx*TS+8,cy=ty*TS+10;if(Math.abs(o.x-cx)<=10&&Math.abs(o.y-2-cy)<=10)return id;}return null;}
function blocked(x,y){if(G&&G.rz&&G.rz.mode=='stay'&&Math.abs(x-G.rz.x)<9&&Math.abs(y-G.rz.y)<6)return true;if(CHEAT.noclip)return x<4||y<6||x>W*TS-4||y>H*TS-1;for(const [cx,cy] of [[x-5,y-5],[x+5,y-5],[x-5,y+1],[x+5,y+1]]){
  const tx=Math.floor(cx/TS),ty=Math.floor(cy/TS);if(tx<0||ty<0||tx>=W||ty>=H||SOLID.has(map[ty][tx]))return true;}return false;}
function rzSet(m){const r=rzS();if(m=='home'){puff(Math.floor(r.x/TS),Math.floor(r.y/TS),'#c9cdd5',10);r.mode='counter';npcSnap('rzel');}
  else{r.mode=m;if(m=='follow')rzTrail=[];}}

// ---------- Speech bubbles ----------
const bubbles={};
function say(id,text,dur){bubbles[id]={text,t:dur||4};}
function updateBubbles(dt){for(const id in bubbles){bubbles[id].t-=dt;if(bubbles[id].t<=0)delete bubbles[id];}}
function drawBubbles(){const f=K/DPR;ctx.font='bold 11px monospace';
  for(const id in bubbles){if(RT[id]&&RT[id].hidden)continue;const b=bubbles[id],o=npcObj(id),hh=NPCDEF[id].h;let sx=(o.x-cam.x)*f,sy=(o.y-hh-4-cam.y)*f;
    const lines=[];let line='';for(const w of b.text.split(' ')){const tr=line?line+' '+w:w;if(ctx.measureText(tr).width>150&&line){lines.push(line);line=w;}else line=tr;}if(line)lines.push(line);
    const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+14,bh=lines.length*13+10;let bx=Math.round(sx-bw/2),by=Math.round(sy-bh-8);
    bx=Math.max(4,Math.min(cssW-bw-4,bx));by=Math.max(cssW<600?150:4,by);ctx.globalAlpha=Math.min(1,b.t*3);
    ctx.fillStyle='#2b1a0e';ctx.fillRect(bx-2,by-2,bw+4,bh+4);ctx.fillStyle='#fff8e8';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#2b1a0e';ctx.fillRect(Math.round(sx)-4,by+bh+2,8,2);ctx.fillRect(Math.round(sx)-2,by+bh+4,4,3);ctx.fillStyle='#fff8e8';ctx.fillRect(Math.round(sx)-3,by+bh,6,2);ctx.fillRect(Math.round(sx)-1,by+bh+2,2,2);
    ctx.fillStyle='#8a2e1e';ctx.textAlign='left';ctx.textBaseline='alphabetic';lines.forEach((l,i)=>{ctx.fillStyle='#3b2414';ctx.fillText(l,bx+7,by+15+i*13);});ctx.globalAlpha=1;}}
function onEnterBuilding(b){setTimeout(()=>{if(INB===b)onEnterBuilding2(b);},350);}
function onEnterBuilding2(b){
  const inB=id=>{if(RT[id].hidden)return false;const o=npcObj(id);return bldInside(o.x,o.y)===b;};
  if(b.id=='shop'){const m=relOf('rzel').mem;if(m.lastVisit!=G.day){m.visits++;}
    if(inB('rzel'))say('rzel',greetLine(m.lastVisit!=G.day),5);m.lastVisit=G.day;
    let d=0;for(const id of ['mabel','pip','ares'])if(inB(id)){setTimeout(()=>say(id,id=='mabel'?pick(['Oh hello, dear!','Shopping too? Rzel saves me the good flour.']):id=='pip'?pick(['Hi!! Are you buying candy?','Rzel let me count the seeds!']):pick(["Stocking up? Don't skip arm day.","Fancy meeting you in the shop, farmer."]),3),900+d);d+=900;}}

function giftRzel(){const it=giftable()[0];if(!it){rzMood='mad';rzFlash('mad');return "Empty-handed? That's okay - your company is the best gift. (Bring a crop or chocolate!)";}return giveGift('rzel',it);}

function findEvent(id,eid){return (HEART_EVENTS[id]||[]).find(e=>e.id==eid);}
function pendingEvent(id){const R=relOf(id),h=heartsOf(id);if(R.evDay==G.day)return null;
  return (HEART_EVENTS[id]||[]).find(e=>!e.manual&&h>=e.h&&!R.seen.includes(e.id)&&(!e.cond||e.cond()));}
function startEvent(id,eid){const ev=findEvent(id,eid);if(!ev)return;shopOpen=false;const R=relOf(id);R.evDay=G.day;
  dlg={npc:id,event:{id:eid,ev,i:0,queue:ev.steps.slice()},sel:0};showEventStep();}
function showEventStep(){const E=dlg.event,st=E.queue[E.i];if(!st){endEvent();return;}
  dlg.name=st.s=='narr'?'':NPCDEF[st.s].name;dlg.speaker=st.s;dlg.mood=st.m||'normal';dlg.text=st.t;dlg.sel=0;
  dlg.choices=st.c?st.c.map((c,i)=>[c[0],'ev:'+i]):[['Next','ev:next']];}

  if(E.id=='wedding'){R.married=true;R.engaged=false;rzS().mode='counter';npcSnap('rzel');}

  if(a!='ev:next'&&st.c){const c=st.c[+a.slice(3)];addRel(dlg.npc,c[1]);E.queue.splice(E.i+1,0,{s:st.s,t:c[2],m:c[1]<0?'mad':c[1]>=30?'blush':'smile'});}
  E.i++;showEventStep();}

function talkNPC(id){if(id=='rzel'){talkRzel();return;}const R=relOf(id);

function rzChoices(){const r=rzS(),c=[['Chat','chat'],['Your day?','day'],['Flirt','flirt'],['Gift','gift']];
  if(r.mode=='counter'){if(shopIsOpen())c.push(['Shop','shop']);c.push(['Follow me','follow']);}
  else if(r.mode=='follow'){c.push(['Stay here','stay'],['Go back','home']);}

function talkRzel(){const r=rzS(),R=relOf('rzel');rzMood='normal';

  let text=r.mode=='follow'?"Right behind you, farmer. Where to?":r.mode=='stay'?"Holding my ground. Want me back on the road?":greetLine(R.mem.lastVisit!=G.day);

function choose(i){const c=dlg.choices[i];if(!c)return;const a=c[1],id=dlg.npc||'rzel';

    dlg.back=dlg.choices;dlg.choices=items.slice(0,6).map(k=>[itemName(k).replace('Moonstone ','').replace('Chocolate','Choco')+' x'+G.inv[k],'give:'+k]).concat([['Back','back']]);dlg.sel=0;dlg.text='What will you give '+NPCDEF[id].name+'?';return;}

  if(a.startsWith('give:')){const t=giveGift(id,a.slice(5));if(!dlg)return;dlg.mood=rzMood;dlg.choices=(dlg.back||[]).filter(x=>x[1]!='gift');dlg.sel=0;aiSay(id,'gift',t);return;}
  if(a=='chat'){relOf(id).mem.chats++;rzMood=id=='rzel'?(heartsOf('rzel')>=6?'blush':'smile'):'normal';dlg.mood=rzMood;aiSay(id,'chat',chatLine(id));return;}

function shopGoods(){const g=Object.keys(CROPS).map(c=>({k:c+'_seed',name:CROPS[c].name+' seed',price:CROPS[c].seedPrice,sub:CROPS[c].days+' days, sells '+CROPS[c].sell+'g',icon:'icon_seed_'+c}));
  g.push({k:'ore',name:'Iron Ore',price:80,sub:'Ares loves this',color:'#7a8490'});
  g.push({k:'bouquet',name:'Bouquet',price:200,sub:'Give at 8 hearts to start dating',icon:null,color:'#e86a9a'});
  if(relOf('rzel').dating&&!relOf('rzel').married)g.push({k:'pendant',name:'Moonstone Pendant',price:2000,sub:'A proposal (dating + 10 hearts)',icon:null,color:'#9ad8ff'});return g;}
function shopKey(k){if(k=='escape'||k=='e'){shopOpen=false;return;}const g=shopGoods(),i=+k-1;
  if(i>=0&&i<g.length){const it=g[i];if(G.gold>=it.price){G.gold-=it.price;G.inv[it.k]=(G.inv[it.k]||0)+1;game.msg('Bought '+it.name+'.');}else game.msg('Not enough gold.');}
  if(k=='s'){let s=0;for(const c in CROPS){s+=G.inv[c]*CROPS[c].sell;G.inv[c]=0;}for(const it in ITEMS){if(!ITEMS[it].sell)continue;s+=G.inv[it]*ITEMS[it].sell;G.inv[it]=0;}G.gold+=s;game.msg('Sold goods for '+s+'g.');}}
function drawShop(){const g=shopGoods(),w=Math.min(460,cssW-16),fs=w<420?11:14,rh=32,H2=60+g.length*rh+64,x=cssW/2-w/2,y=Math.max(8,Math.min(120,cssH/2-H2/2-40));
  if(cssW-(x+w)>=110)drawVN(0,y+H2,Math.min(cssH*0.5,300),x+w+12);panel(x,y,w,H2);
  txt('GENERAL STORE',x+16,y+30,{s:fs+3,c:'#8a2e1e'});icon('icon_coin',x+w-110,y+14,2);txt(G.gold+'g',x+w-16,y+30,{s:fs+2,a:'right'});
  g.forEach((it,i)=>{const yy=y+46+i*rh;if(it.icon)icon(it.icon,x+14,yy,2);else{ctx.fillStyle=it.color;ctx.fillRect(x+18,yy+4,20,20);ctx.fillStyle='#fff8';ctx.fillRect(x+20,yy+6,6,6);}
    txt((i+1)+') '+it.name+'  '+it.price+'g',x+52,yy+14,{s:fs});txt(it.sub+(G.inv[it.k]?'  (have '+G.inv[it.k]+')':''),x+52,yy+27,{s:fs-2,b:false,c:'#6b3a1a'});});
  txt('S) Sell crops & chocolate',x+16,y+H2-36,{s:fs});txt('E / Esc) Leave',x+16,y+H2-14,{s:fs});}

// ---------- Sleep / pass out / day start ----------
function sleep(){const pass=G.time>=26*60;
  for(const k in G.soil){const s=G.soil[k];if(s.crop&&s.wet&&s.growth<CROPS[s.crop].days&&season()!='winter')s.growth++;s.wet=false;}
  let lost=0;if(pass){lost=Math.min(1000,Math.floor(G.gold*0.1));G.gold-=lost;relOf('rzel').mem.passedOut=G.day+1;}
  G.day++;G.time=6*60;G.energy=pass?Math.floor(G.maxE*0.6):G.maxE;G.p.x=16*TS+8;G.p.y=12*TS+10;G.p.dir='down';
  startDay();npcSnapAll();snapCam();save(true);
  game.msg('Day '+G.day+' ('+cap1(season())+' '+dayOfSeason()+') - '+ev().name+(pass?' - you passed out and lost '+lost+'g':''));
  const R=relOf('rzel');
  if(R.engaged&&G.day>=R.wedDay){G.pendingWedding='rzel';}
  {const Ra=relOf('ares');if(Ra.engaged&&G.day>=Ra.wedDay)G.pendingWedding='ares';
   if(Ra.married&&!G.pendingWedding){const r=Math.random();if(r<0.25){waterAll();setTimeout(()=>game.msg('Ares watered the crops this morning \u2665'),1500);}
    else if(r<0.4){G.inv.ore=(G.inv.ore||0)+1;setTimeout(()=>game.msg('Ares left you Iron Ore \u2665'),1500);}
    setTimeout(()=>say('ares',aresSpouseLine(),5),600);}}
  if(R.married&&!G.pendingWedding){const r=Math.random();if(r<0.25){waterAll();setTimeout(()=>game.msg('Rzel watered the crops this morning \u2665'),1500);}
    else if(r<0.45){G.inv.chocolate++;setTimeout(()=>game.msg('Rzel left you a chocolate on the table \u2665'),1500);}
    setTimeout(()=>say('rzel',spouseLine(),5),600);}
  if(isHalloween())setTimeout(()=>game.msg('Happy Pumpkin Night! The town is decorated.'),3200);}

// ---------- Lighting ----------
const LAMPS=[[31,15],[33,17],[39,17],[45,17],[21,17],[31,23],[31,30],[33,39],[39,41],[51,16],[11,15],[28,15]];
let LC=null;
function lightPts(){const L=[],nd=nightAmt();if(nd<=0.02)return L;
  for(const [x,y] of LAMPS)if(map[y]&&map[y][x]==0)L.push([x*TS+4,y*TS-12,46]);
  for(const b of BUILDINGS){const yy=(b.y+b.h-1)*TS;for(const xx of [b.x+1,b.x+b.w-2])L.push([xx*TS+8,yy+18,20]);}
  if(isHalloween())for(const p of PUMPKINS)L.push([p[0]*TS+8,p[1]*TS+8,22]);
  L.push([G.p.x,G.p.y-8,24]);return L;}
function nightAmt(){const h=G.time/60,ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};return ss(18.5,21,h)*(1-0)+(h<6.5?1-ss(5.5,6.5,h):0);}
function drawLighting(){const h=G.time/60,ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const morn=1-ss(6,8,h),eve=ss(16,18.5,h)*(1-ss(19,21,h)),night=ss(18.5,21,h),hw=isHalloween();
  let c=[255,255,255];const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  c=mix(c,[255,214,190],morn*0.8);c=mix(c,[255,186,130],eve);c=mix(c,hw?[78,52,120]:[52,62,122],night);
  if(INB)c=mix(c,[255,232,196],night*0.85+eve*0.4);
  if(c.every(v=>v>=254))return;
  if(!LC){LC=document.createElement('canvas');}if(LC.width!=Math.ceil(cssW)||LC.height!=Math.ceil(cssH)){LC.width=Math.ceil(cssW);LC.height=Math.ceil(cssH);}
  const l=LC.getContext('2d');l.globalCompositeOperation='source-over';l.fillStyle='rgb('+c.map(Math.round).join(',')+')';l.fillRect(0,0,LC.width,LC.height);
  if(!INB&&night>0.05){l.globalCompositeOperation='lighter';const f=K/DPR;
    for(const [wx,wy,r] of lightPts()){const sx=(wx-cam.x)*f,sy=(wy-cam.y)*f,R=r*f,g=l.createRadialGradient(sx,sy,0,sx,sy,R);
      g.addColorStop(0,'rgba(255,190,110,'+(0.85*night)+')');g.addColorStop(0.5,'rgba(255,160,80,'+(0.35*night)+')');g.addColorStop(1,'rgba(0,0,0,0)');l.fillStyle=g;l.fillRect(sx-R,sy-R,R*2,R*2);}}
  ctx.globalCompositeOperation='multiply';ctx.drawImage(LC,0,0,cssW,cssH);ctx.globalCompositeOperation='source-over';}

// ---------- World extras: villagers, lamps, Halloween decor, rain on windows ----------
const PUMPKINS=[[39,16],[41,16],[33,15],[15,16],[18,16],[36,17],[44,16],[30,16],[53,14],[37,40]];
function drawWorldExtras(objs,now){const night=nightAmt();
  for(const [x,y] of LAMPS)if(map[y]&&map[y][x]==0)objs.push({y:y*TS+12,d:()=>{shadow(x*TS+4,y*TS+12,3,1.2,0.3);drawS('lamp',x*TS,y*TS-13);if(night>0.1){ctx.fillStyle='rgba(255,230,150,'+(0.5*night)+')';ctx.fillRect(x*TS+2,y*TS-10,4,4);}}});
  if(isHalloween()){for(const [x,y] of PUMPKINS)if(map[y]&&!SOLID.has(map[y][x]))objs.push({y:y*TS+12,d:()=>{shadow(x*TS+8,y*TS+13,5,1.6,0.3);drawS(night>0.2?'jack_lit':(x+y)%2?'jack':'pumpkin',x*TS+2,y*TS+3);}});
    for(const x of [37,43])objs.push({y:COUNTER_Y*TS+1,d:()=>drawS('jack',x*TS+2,COUNTER_Y*TS-4)});
    // bunting along the shop front
    const b=BUILDINGS.find(b=>b.id=='shop');objs.push({y:(b.y+b.h-1)*TS+2,d:()=>{ctx.globalAlpha=b.alpha;for(let i=0;i<b.w*2;i++){const bx=b.x*TS+i*8,by=(b.y+b.h-1)*TS-6+(i%2);ctx.fillStyle=i%2?'#8a3ab0':'#f08a1a';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+7,by);ctx.lineTo(bx+3.5,by+6);ctx.fill();}ctx.globalAlpha=1;}});}
  for(const id of ['mabel','pip','ares']){const rt=RT[id];if(rt.hidden)continue;const o=npcObj(id),def=NPCDEF[id],s=SPR[def.sheet];if(!s)continue;
    objs.push({y:o.y,d:()=>{shadow(o.x,o.y+1,id=='ares'?6:5,id=='ares'?2.2:2,0.3);const row={down:0,up:1,left:2,right:3}[o.dir]||0,col=rt.moving?[1,2,3,2][Math.floor((rt.walk||0)/5)%4]:0,hh=def.h,fw=s.width/4,fh=s.height/4,ww=fw*hh/fh,bob=rt.moving?0:(Math.floor(now/800)%2)/3;
      ctx.imageSmoothingEnabled=false;ctx.drawImage(s,col*fw,row*fh,fw,fh,Math.round((o.x-ww/2)*3)/3,o.y-hh+1+bob,ww,hh);
      if(id=='pip'&&schedNow('pip')[2]=='fish'&&!rt.moving){ctx.strokeStyle='#5a3a1a';ctx.lineWidth=0.7;ctx.beginPath();ctx.moveTo(o.x+4,o.y-10);ctx.lineTo(o.x+10,o.y-18);ctx.stroke();ctx.strokeStyle='#ddd';ctx.lineWidth=0.4;ctx.beginPath();ctx.moveTo(o.x+10,o.y-18);ctx.lineTo(o.x+11,o.y+10);ctx.stroke();ctx.fillStyle='#e04040';ctx.fillRect(o.x+10.5,o.y+10+Math.sin(now/300),1.5,1.5);}}});}}
function drawWindowRain(now){if(!INB)return;const b=INB,yy=(b.y+b.h-1)*TS;ctx.fillStyle='rgba(160,200,255,0.8)';
  for(let x=b.x;x<b.x+b.w;x++){const tl=(x==b.x+1||x==b.x+b.w-2||(x==b.x+b.w-3&&b.w>8));if(!tl)continue;for(let i=0;i<4;i++){const ry=(now/40+i*7+x*13)%9;ctx.fillRect(x*TS+5+i*2,yy+4+ry,0.6,2);}}}

// ---------- Per-frame town update (called from update) ----------
function updateTown(dt){const b=bldInside(G.p.x,G.p.y);INB=b;if(b&&b!==lastINB)onEnterBuilding(b);lastINB=b;updateBubbles(dt);
  if(G.pendingWedding&&!dlg&&!shopOpen&&!cheatOpen){const w=G.pendingWedding;G.pendingWedding=false;startEvent(w==='ares'?'ares':'rzel',w==='ares'?'aWedding':'wedding');}}

// ---------- DEV menu (tabbed: Character / Item / Time / Weather) ----------
let cheatTab='char',cheatNpc='rzel';
function cheatAct(a){const p=a.split(':');
  if(p[0]=='tab'){cheatTab=p[1];}
  else if(p[0]=='tog'){CHEAT[p[1]]=!CHEAT[p[1]];}
  else if(p[0]=='npc'){cheatNpc=p[1];}
  else if(p[0]=='hearts'){const R=relOf(cheatNpc),n=+p[1];if((cheatNpc=='rzel'||cheatNpc=='ares')&&n>8&&!R.dating)R.dating=true;if((cheatNpc=='rzel'||cheatNpc=='ares')&&n>10&&!R.married){R.married=true;R.dating=true;}R.pts=Math.min(heartCap(cheatNpc),n)*100;game.msg(NPCDEF[cheatNpc].name+' hearts: '+heartsOf(cheatNpc));}
  else if(p[0]=='status'){const R=relOf(cheatNpc);R.dating=p[1]!='friend';R.engaged=p[1]=='engaged';R.married=p[1]=='married';if(p[1]=='engaged')R.wedDay=G.day+3;if(cheatNpc=='rzel'&&R.married){rzS().mode='counter';RT.rzel.spot=null;}game.msg(NPCDEF[cheatNpc].name+' status: '+statusOf(cheatNpc));}
  else if(p[0]=='event'){toggleCheats();startEvent(p[1],p[2]);return;}
  else if(a=='evreset'){relOf(cheatNpc).seen=[];relOf(cheatNpc).evDay=0;game.msg('Heart events reset for '+NPCDEF[cheatNpc].name);}
  else if(a=='npc2me'){if(cheatNpc=='rzel')rzS().mode='stay';const o=npcObj(cheatNpc);o.x=G.p.x+14;o.y=G.p.y;RT[cheatNpc].path=[];RT[cheatNpc].hidden=false;if(cheatNpc!='rzel'){RT[cheatNpc].spot='manual';RT[cheatNpc].lock=G.time;}}
  else if(a=='me2npc'){const o=npcObj(cheatNpc);G.p.x=o.x;G.p.y=o.y+14;if(blocked(G.p.x,G.p.y))G.p.y=o.y-14;snapCam();}
  else if(a=='follow'){if(rzS().mode=='follow')rzSet('home');else{rzSet('follow');rzWarp();}game.msg('Rzel follow: '+(rzS().mode=='follow'?'ON':'OFF'));}
  else if(p[0]=='item'){G.inv[p[1]]=(G.inv[p[1]]||0)+(+p[2]);game.msg('+'+p[2]+' '+itemName(p[1].replace('_seed',''))+(p[1].endsWith('_seed')?' seed':''));}
  else if(a=='gold')G.gold+=1000; else if(a=='gold10k')G.gold+=10000; else if(a=='energy')G.energy=G.maxE;
  else if(a=='grow'){let n=0;for(const k in G.soil){const s=G.soil[k];if(s.crop){s.growth=CROPS[s.crop].days;n++;}}game.msg(n+' crops ready to harvest.');}
  else if(a=='water'){waterAll();game.msg('All soil watered.');}
  else if(a=='sleep')sleep();
  else if(p[0]=='hour'){G.time=+p[1];game.msg('Time set.');}
  else if(a=='h1')G.time=Math.min(G.time+60,26*60-1);
  else if(p[0]=='day'){G.day=Math.max(1,G.day+(+p[1]));startDay();npcSnapAll();game.msg('Day '+G.day+' - '+cap1(season())+' '+dayOfSeason());}
  else if(p[0]=='season'){G.seasonSet=p[1]=='auto'?null:p[1];startDay();npcSnapAll();game.msg('Season: '+cap1(season()));}
  else if(a=='halloween'){G.hwDay=G.hwDay==G.day?0:G.day;npcSnapAll();game.msg('Halloween today: '+(isHalloween()?'ON':'OFF'));}
  else if(p[0]=='wx'){const e=EVENTS.find(e=>e.id==p[1]);G.weather=e.id;e.onDayStart&&e.onDayStart(game);initParticles();npcSnapAll();game.msg('Weather: '+e.name);}
  else if(p[0]=='tp'){tp(p[1]);rzTrail=[];}
  else if(a=='heart'){addRel(cheatNpc,100);game.msg(NPCDEF[cheatNpc].name+' hearts: '+heartsOf(cheatNpc));}
  else if(a=='reset'){if(confirm('Reset save? This deletes your progress.')){localStorage.removeItem('meadowbrook_save');newGame();snapCam();game.msg('Save reset - new game.');}}
  renderCheats();}
function renderCheats(){const B=(a,l,on)=>'<button data-a="'+a+'"'+((on||(a.startsWith('tog:')&&CHEAT[a.slice(4)]))?' class="on"':'')+'>'+l+'</button>';const S=t=>'<div class="sec">'+t+'</div>';
  const el=document.getElementById('cheat');const tabs=[['char','Character'],['item','Item'],['time','Time'],['weather','Weather']];
  let h='<h3>DEV MENU <button data-a="close">X</button></h3><div class="tabs">'+tabs.map(t=>'<button data-a="tab:'+t[0]+'"'+(cheatTab==t[0]?' class="sel"':'')+'>'+t[1]+'</button>').join('')+'</div>';
  if(cheatTab=='char'){const R=relOf(cheatNpc);
    h+=S('NPC')+Object.keys(NPCDEF).map(id=>B('npc:'+id,NPCDEF[id].name,cheatNpc==id)).join('')+
      '<div class="info">'+NPCDEF[cheatNpc].name+': '+heartsOf(cheatNpc)+'/'+heartCap(cheatNpc)+' hearts &middot; '+statusOf(cheatNpc)+'</div>'+
      S('Set hearts')+[0,2,4,6,8,10,12,14].filter(n=>cheatNpc=='rzel'||cheatNpc=='ares'||n<=10).map(n=>B('hearts:'+n,n+'\u2665')).join('')+B('heart','+1\u2665');
    if(cheatNpc=='rzel'||cheatNpc=='ares')h+=S('Status')+B('status:friend','Friend',!R.dating)+B('status:dating','Dating',R.dating&&!R.engaged&&!R.married)+B('status:engaged','Engaged',R.engaged)+B('status:married','Married',R.married);
    h+=S('Heart events')+(HEART_EVENTS[cheatNpc]||[]).map(e=>B('event:'+cheatNpc+':'+e.id,(R.seen.includes(e.id)?'\u2713 ':'')+e.h+'\u2665 '+e.title)).join('')+B('evreset','Reset seen');
    h+=S('Move')+B('npc2me','NPC to me')+B('me2npc','Me to NPC')+(cheatNpc=='rzel'?B('follow','Rzel follow',rzS().mode=='follow'):'')+B('tog:noclip','Noclip')+B('tog:speed','Speed x2')+
      S('Teleport me')+Object.keys(TELE).map(n=>B('tp:'+n,cap1(n))).join('');}
  else if(cheatTab=='item'){h+=S('Money & energy')+B('gold','+1000g')+B('gold10k','+10000g')+B('tog:gold','Inf gold')+B('energy','Full energy')+B('tog:energy','Inf energy');
    const it=Object.keys(CROPS).map(c=>c+'_seed').concat(Object.keys(CROPS),Object.keys(ITEMS));
    h+=S('Items')+it.map(k=>'<span class="it">'+itemName(k.replace('_seed',''))+(k.endsWith('_seed')?' seed':'')+' ('+(G.inv[k]||0)+') '+B('item:'+k+':1','+1')+B('item:'+k+':10','+10')+'</span>').join('');
    h+=S('Farm')+B('grow','Grow all')+B('water','Water all');}
  else if(cheatTab=='time'){const hr=Math.floor(G.time/60)%24,mm=Math.floor(G.time%60);
    h+='<div class="info">Day '+G.day+' &middot; '+cap1(season())+' '+dayOfSeason()+' &middot; '+((hr%12)||12)+':'+String(mm).padStart(2,'0')+(hr<12?'am':'pm')+(isHalloween()?' &middot; HALLOWEEN':'')+'</div>'+
      S('Set hour')+[[360,'6am'],[480,'8am'],[540,'9am'],[720,'12pm'],[900,'3pm'],[1080,'6pm'],[1260,'9pm'],[1440,'12am'],[1550,'1:50am']].map(t=>B('hour:'+t[0],t[1])).join('')+B('h1','+1h')+
      S('Day')+B('sleep','Skip day (sleep)')+B('day:1','Day +1')+B('day:-1','Day -1')+B('day:7','Day +7')+
      S('Season')+SEASONS.map(s=>B('season:'+s,cap1(s),season()==s)).join('')+B('season:auto','Auto',!G.seasonSet)+
      S('Festival')+B('halloween','Halloween today',isHalloween());}
  else{h+=S('Weather today')+EVENTS.map(e=>B('wx:'+e.id,e.name,G.weather==e.id)).join('')+S('Danger')+B('reset','Reset save');}
  el.innerHTML=h;document.getElementById('cheatBadge').classList.toggle('show',Object.values(CHEAT).some(v=>v));}

// ================= LOOP =================
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop);}
makeSprites();makeRzel();makeRoofs();makeDecor();makeSeasonal();
newGame(); if(localStorage.getItem('meadowbrook_save'))load(); npcSnapAll(); snapCam(); requestAnimationFrame(loop);
</script></body></html>
